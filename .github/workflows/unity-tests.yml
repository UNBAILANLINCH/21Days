# EditMode 测试：push 到 main、开 PR、手动触发时跑一遍纯逻辑测试。
# 没配 Unity 许可证 secret 时整条流水线跳过而不是失败 —— 仓库刚克隆下来也应该是绿的。
# 一次性配置见 docs/ci-setup.md。
name: Unity 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交把旧的测试任务顶掉，省 runner 时间
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # secrets 不能直接写在 job 级的 if 里（job 级 if 取不到 secrets 上下文），
  # 所以先用一个 step 把「有没有配许可证」转成 job 输出，后面的 job 再判断这个输出。
  check-license:
    name: 检查许可证 secret
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.probe.outputs.has_license }}
    steps:
      - name: 探测 UNITY_LICENSE 是否已配置
        id: probe
        env:
          HAS: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          echo "has_license=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" = "true" ]; then
            echo "::notice::已检测到 UNITY_LICENSE，继续跑 EditMode 测试。"
          else
            echo "::notice::未配置 UNITY_LICENSE，跳过 Unity 测试（不算失败）。配置步骤见 docs/ci-setup.md"
          fi

  editmode-tests:
    name: EditMode 测试
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # unity-test-runner 拿 githubToken 回写 Checks 结果
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        # 本仓库暂未启用 git-lfs（见 .gitattributes），素材体积上来后这里要加 lfs: true

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          # 包清单或 Unity 版本变了就重新导入资产；否则复用上次的 Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-

      - name: 跑 EditMode 测试
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # auto 表示从 ProjectSettings/ProjectVersion.txt 读版本，升级 Unity 时这里不用改
          unityVersion: auto
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: test-results
          checkName: EditMode 测试结果

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always() # 测试失败时更需要这份结果
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14
          if-no-files-found: warn
