<script>

  ['包','背包道具','使用 / 合成','药物、材料、关键道具、皮面具与钥匙；使用、治疗、合成、任务交付。合成原料消耗已有约定。'],

  ['任','任务追踪','章节 / 当前目标','序章与十二阶段、主支线目标、任务追踪；显示当前世界与下一步调查方向。'],
  ['图','场景地图','两界 / 楼层 / 出口','当前世界、所在地点、玩家位置、已知通路、楼梯与出口；两界切换通过场景入口触发。'],
  ['关','关卡记录','五店 / 阶段机制','戏班调度演奏、衣肆推理领衣、金银行拨料打造、客栈线索、酒肆灌酒；后续水位、队列、镜面迷宫与幻象。'],

  ['规','规则说明','潜行 / 暗杀 / 风险','潜行、暗杀门槛、警戒与追逐、击倒、身份核验与暴露、区域机制。背后处决只对允许的目标开放。'],

 ];

 const drawer='<div class="veil"></div><aside class="drawer"><div class="drawer-header"><div class="drawer-avatar">本体</div><div><strong>功能收纳</strong><small>本体生命 3 / 3 · 身份：本体</small></div><button type="button" class="close cursor-interaction" aria-label="收起功能面板">×</button></div><div class="drawer-title">身份 · 调查 · 关卡 · 系统<small>12 个入口</small></div><div class="features">'+features.map((f,i)=>'<button type="button" class="feature cursor-interaction'+(i===0?' selected':'')+'" data-feature="'+i+'" aria-pressed="'+(i===0)+'"><span class="bubble">'+f[0]+'</span><span>'+f[1]+'</span><small>'+f[2]+'</small></button>').join('')+'</div><div class="drawer-foot">现场行动在主界面，资料与管理在这里<div class="tags">'+['暗杀与追逐','身份风险','五店玩法','水位与队列','镜面与幻象'].map(n=>'<span>'+n+'</span>').join('')+'</div></div><div class="detail" aria-live="polite">'+features[0][3]+'</div><div class="plan-note">低保真方案 · 数值为当前原型，待定规则未视为定稿</div></aside>';
 root.querySelectorAll('.screen').forEach(screen=>{
  screen.innerHTML=world+hud+drawer;

  screen.querySelector('.close').addEventListener('click',()=>screen.classList.remove('expanded'));
  screen.querySelector('.veil').addEventListener('click',()=>screen.classList.remove('expanded'));
  screen.querySelectorAll('[data-feature]').forEach(button=>button.addEventListener('click',()=>{
   screen.querySelector('.detail').textContent=features[Number(button.dataset.feature)][3];
   screen.querySelectorAll('[data-feature]').forEach(other=>{const active=button===other;other.classList.toggle('selected',active);other.setAttribute('aria-pressed',String(active))});
  }));
  const actionDetails={execute:'暗杀：可处决种类、背后、近距、未察觉；BOSS偷袭另走开战。',borrow:'附身：选择可借用活角色；与暗杀和使用面具分开。',sneak:'潜行：降低近距察觉风险；醉酒会限制静步。',skill:'身份能力：借到对应身份后显示调度、演奏、拨料、打造等。',item:'快捷道具：按当前用途使用药物、钥匙或特殊物件。'};
  screen.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{screen.querySelector('.notice').textContent=actionDetails[button.dataset.action]}));
 });
