# 出包：push 形如 v0.1.0 的 tag，或在 Actions 页手动触发。
# 手游（Android / APK）与端游（Windows 64 位）共用同一套内容，只是 targetPlatform 不同。
#
# 与本机打包的关系：
#   - CI 这条路走 game-ci/unity-builder 自带的构建入口（它注入自己的 BuildScript）；
#   - 本机走 scripts/build.ps1 → Game.Editor.BuildScript.BuildWindows / BuildAndroid；
#   - 两者共用 EditorBuildSettings 里的场景列表，所以场景增删只需在编辑器里改一次。
#   - iOS 需要 macOS runner + Xcode（还要证书与描述文件），第三阶段再加，这里不做。
#
# 一次性配置（三个 secret）见 docs/ci-setup.md。
name: 打包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      targets:
        description: '要打的平台，逗号分隔（StandaloneWindows64 / Android）'
        required: false
        default: 'StandaloneWindows64,Android'
      version:
        description: '版本号，如 0.1.0；留空则沿用 ProjectSettings 里的版本'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # 出包跑一半被顶掉更亏，排队等着就行

jobs:
  # 和测试流水线同一道门：secrets 取不到 job 级 if，先用 step 转成 job 输出。
  # 顺带把 workflow_dispatch 的平台输入解析成矩阵用的 JSON 数组。
  check-license:
    name: 检查许可证与解析平台
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.probe.outputs.has_license }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: 探测 UNITY_LICENSE 是否已配置
        id: probe
        env:
          HAS: ${{ secrets.UNITY_LICENSE != '' }}
        run: |
          echo "has_license=$HAS" >> "$GITHUB_OUTPUT"
          if [ "$HAS" = "true" ]; then
            echo "::notice::已检测到 UNITY_LICENSE，继续出包。"
          else
            echo "::notice::未配置 UNITY_LICENSE，跳过打包（不算失败）。配置步骤见 docs/ci-setup.md"
          fi

      - name: 解析要打的平台
        id: matrix
        env:
          # tag 触发时没有 inputs，回落到两个平台都打
          TARGETS: ${{ github.event.inputs.targets || 'StandaloneWindows64,Android' }}
        run: |
          JSON=$(printf '%s' "$TARGETS" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          if [ -z "$JSON" ] || [ "$JSON" = "[]" ]; then
            JSON='["StandaloneWindows64","Android"]'
          fi
          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "::notice::本次打包平台：$JSON"

  build:
    name: 打包 ${{ matrix.targetPlatform }}
    needs: check-license
    if: needs.check-license.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag 触发时要创建 / 更新 Release
    strategy:
      fail-fast: false # 一个平台挂了不影响另一个出包
      matrix:
        targetPlatform: ${{ fromJSON(needs.check-license.outputs.targets) }}
    steps:
      - name: 腾出磁盘空间
        if: matrix.targetPlatform == 'Android'
        # Android 镜像加上 Library 缓存很容易把 runner 的盘撑满，先清掉用不上的预装 SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versioning: Tag 要读到 tag 历史

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: Library
          # 不同平台的导入产物不通用，key 里带上 targetPlatform
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: 构建
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          # auto：从 ProjectSettings/ProjectVersion.txt 读版本
          unityVersion: auto
          buildName: 21Days
          buildsPath: build
          # 版本号三选一：
          #   tag 触发        → Tag，直接用 v0.1.0 这个 tag 名当版本
          #   手动触发填了版本 → Custom，用输入框里的 version
          #   手动触发没填     → None，沿用 ProjectSettings 里的版本，不改工程
          versioning: ${{ startsWith(github.ref, 'refs/tags/v') && 'Tag' || (github.event.inputs.version != '' && 'Custom' || 'None') }}
          version: ${{ github.event.inputs.version }}
          # 出 APK（装机即用）；上架 Google Play 要的 AAB 是 androidAppBundle，第三阶段再说
          androidExportType: androidPackage
          # CI 上 Library 缓存会让工作区显得"脏"，不允许的话构建直接拒跑
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 21Days-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
          if-no-files-found: error

      - name: 压缩成发布包
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PLATFORM: ${{ matrix.targetPlatform }}
          TAG: ${{ github.ref_name }}
        run: |
          TAG_SAFE=$(printf '%s' "$TAG" | tr '/' '-')
          cd build && zip -r "../21Days-${PLATFORM}-${TAG_SAFE}.zip" "$PLATFORM"

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        # 两个平台的 job 会先后往同一个 Release 传附件，后到的追加而不是覆盖
        uses: softprops/action-gh-release@v2
        with:
          files: 21Days-*.zip
          generate_release_notes: true
