<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>莱拉 · 首轮开发标注</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161b20;color:#eef1f3;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1250px;margin:auto;padding:22px}h1{font-size:24px;margin:0 0 8px}.muted{color:#aab6c0;font-size:14px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}input,select,textarea,button{font:inherit;border:1px solid #566371;border-radius:8px;background:#242d36;color:inherit;padding:10px}button{cursor:pointer}button:hover{background:#344655}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr);gap:22px}.frame{background:#0b0e12;border-radius:12px;display:flex;align-items:center;min-height:380px}img{width:100%;height:auto;display:block}#labels{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}button.selected{background:#2d685e;border-color:#8bd6bd}textarea{width:100%;height:95px;resize:vertical}label{display:block;margin:14px 0 7px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}progress{width:100%;accent-color:#86d4b9}#status{min-height:24px;color:#a5e4c8}.error{color:#ffac9b!important}.hidden{display:none!important}a{color:#b5dfec}#sample{overflow-wrap:anywhere;font:12px monospace}@media(max-width:800px){.layout{grid-template-columns:1fr}.frame{min-height:180px}}
</style>
<main><h1>莱拉 · 首轮开发标注</h1><div class="muted">仅 dev · 单人开发意见，不是独立人类验收或训练金标。请根据图片判断；不确定可选“不明确／混合”。</div>
<div class="top"><input id="who" maxlength="80" placeholder="标注者代号（可用中文）"><button id="start">开始／续标</button><span id="version" class="muted"></span></div>
<div id="work" class="hidden"><div id="progress"></div><progress id="bar"></progress><div class="layout"><section><div class="frame"><img id="image" alt="匿名表情图"></div><p id="sample" class="muted"></p></section><section><div id="labels"></div><label for="clarity">清晰度（可留空）</label><select id="clarity"><option value="">未填写</option><option value="clear">清晰</option><option value="uncertain">不确定</option></select><label for="note">备注（可留空）</label><textarea id="note" maxlength="4000" placeholder="记录混合感受、看不清或疑问"></textarea><div class="nav"><button id="prev">← 上一张</button><button id="next">下一张 →</button><button id="skip">跳过并下一张</button><button id="clear">清除标签</button><button id="pending">下一张未标</button></div><p class="muted">1–8 选类别并保存；← / → 翻页；S 跳过。输入备注时快捷键停用。翻页不会默认填写标签。</p><div id="status" role="status"></div><div class="nav"><button id="csv">导出 CSV</button><button id="json">导出 JSON（含修改历史）</button><button id="exit">保存并退出服务</button></div></section></div></div></main>
<script>
const token=new URLSearchParams(location.search).get('token');
const $=id=>document.getElementById(id);
const labels=['neutral','happy','sad','surprise','fear','disgust','angry','ambiguous'];
let context=null;
setTimeout(()=>api('/context').then(c=>{context=c;document.querySelector('main>.muted').textContent=c.message;if(c.pilot)document.querySelector('h1').textContent='表情 — 独立试点标注';if(!c.annotation_available){$('start').disabled=true;$('who').disabled=true;}}).catch(()=>{}),0);
new MutationObserver(()=>{const role=context?.roles?.[ids[index]];diagnosticLink.classList.toggle('hidden',role?.data_role==='locked-test');if(role&&!$('sample').textContent.includes('角色：'))$('sample').textContent+=' ｜ 角色：'+(role.data_role==='locked-test'?'锁定测试；先盲标，不看预测':'校准；先盲标');}).observe($('sample'),{childList:true});
const chinese=['中性','高兴','悲伤','惊讶','恐惧','厌恶','愤怒','不明确／混合'];
let state=null,ids=[],index=0,entry=null,queue=Promise.resolve(),dirty=false,timer=null,failed=false,moving=false;
const url=(path,extra={})=>path+'?'+new URLSearchParams({token,...extra});
const diagnosticLink=document.createElement('a');diagnosticLink.href=url('/diagnostic');diagnosticLink.target='_blank';diagnosticLink.rel='noopener';diagnosticLink.textContent='打开输入诊断（独立页；显示模型预测）';document.querySelector('.top').append(diagnosticLink);
async function api(path,body,extra={}){let r=await fetch(url(path,extra),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');return d;}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function render(){entry={label:'',clarity:'',note:'',status:'unlabeled',...(state.annotations[ids[index]]||{})};$('image').src=url('/image/'+ids[index]);$('sample').textContent='匿名 ID：'+ids[index];$('clarity').value=entry.clarity;$('note').value=entry.note;paint();let count=Object.values(state.annotations).filter(e=>e.status==='labeled').length,skips=Object.values(state.annotations).filter(e=>e.status==='skipped').length;$('progress').textContent=`第 ${index+1} / ${ids.length} 张 · 已标 ${count} · 跳过 ${skips} · 未标 ${ids.length-count-skips}`;$('bar').max=ids.length;$('bar').value=count;dirty=false;}
function paint(){[...$('labels').children].forEach((b,i)=>b.classList.toggle('selected',entry.label===labels[i]));}
function schedule(){dirty=true;status('待保存…');clearTimeout(timer);timer=setTimeout(()=>persist(),450);}
function persist(cursor=index){clearTimeout(timer);const snapshot=dirty?{id:ids[index],entry:{label:entry.label,clarity:entry.clarity,note:entry.note,status:entry.status}}:{};dirty=false;queue=queue.then(async()=>{if(failed)throw Error('保存已暂停，请重新加载；当前页面未保存内容请先复制');let d=await api('/save',{annotator:state.annotator,revision:state.revision,cursor,...snapshot});state=d.state;status('已自动保存 · '+new Date().toLocaleTimeString());}).catch(e=>{failed=true;dirty=true;status(e.message,true);throw e;});queue.catch(()=>{});return queue;}
async function move(to){if(!state||failed||moving)return;moving=true;$('work').querySelectorAll('button,textarea,select').forEach(e=>e.disabled=true);to=Math.max(0,Math.min(ids.length-1,to));try{await persist(to);index=to;render();}catch(e){}finally{moving=false;$('work').querySelectorAll('button,textarea,select').forEach(e=>e.disabled=false);}}
labels.forEach((key,i)=>{let b=document.createElement('button');b.textContent=`${i+1}  ${chinese[i]}`;b.onclick=()=>{if(!state||failed||moving)return;entry.label=key;entry.status='labeled';paint();schedule();persist();};$('labels').append(b);});
$('start').onclick=async()=>{try{if(state)await persist();const who=$('who').value.trim();let d=await api('/state',null,{annotator:who});state=d.state;ids=d.ids;index=state.cursor;queue=Promise.resolve();failed=false;$('who').disabled=true;$('start').disabled=true;localStorage.setItem('laila-dev-annotator',who);$('work').classList.remove('hidden');$('version').textContent=`开发图 ${d.count} 张 / ${d.groups} 组 · 版本 ${state.dataset_version.slice(0,12)}`;render();status(state.recovery_notice||'已载入，可开始标注');}catch(e){alert(e.message);}};
$('who').value=localStorage.getItem('laila-dev-annotator')||'';
api('/profile').then(p=>{if(!$('who').value&&!state)$('who').value=p.annotator||'';}).catch(()=>{});
$('clarity').onchange=()=>{entry.clarity=$('clarity').value;schedule();};$('note').oninput=()=>{entry.note=$('note').value;schedule();};
$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);
$('skip').onclick=()=>{if(!state||failed)return;entry.label='';entry.status='skipped';paint();dirty=true;move(index+1);};
$('clear').onclick=()=>{if(!state||failed)return;entry.label='';entry.status='unlabeled';paint();schedule();persist();};
$('pending').onclick=()=>{let n=ids.findIndex((id,i)=>i>index&&state.annotations[id]?.status!=='labeled');if(n<0)n=ids.findIndex(id=>state.annotations[id]?.status!=='labeled');if(n>=0)move(n);};
for(const fmt of ['csv','json'])$(fmt).onclick=async()=>{try{await persist();const response=await fetch(url('/export',{annotator:state.annotator,format:fmt}));if(!response.ok)throw Error('导出失败');let blob=await response.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='laila-dev-annotations.'+fmt;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){status(e.message,true);}};
$('exit').onclick=async()=>{try{await persist();await api('/exit',{});status('已保存，服务已退出。下次双击启动即可续标。');document.querySelectorAll('button,input,textarea,select').forEach(e=>e.disabled=true);}catch(e){status(e.message,true);}};
document.addEventListener('keydown',e=>{if(!state||failed||e.repeat||e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(/^[1-8]$/.test(e.key)){e.preventDefault();$('labels').children[Number(e.key)-1].click();}else if(e.key==='ArrowLeft'){e.preventDefault();$('prev').click();}else if(e.key==='ArrowRight'){e.preventDefault();$('next').click();}else if(e.key.toLowerCase()==='s'){e.preventDefault();$('skip').click();}});
$('image').onerror=()=>{failed=true;status('图片加载失败，已停止标注。请重新加载并检查原始包；不自动跳过。',true);};
window.addEventListener('beforeunload',e=>{if(dirty||failed){e.preventDefault();e.returnValue='';}});
</script></html>
