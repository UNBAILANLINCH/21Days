# 执行载体：GitHub Actions，同步分支 push 或手动运行。
# 状态锚点：Actions 的“飞书同步合并请求”运行结果及 codex/feishu-sync → main 的开放 PR。
# 退场条件：停止服务器同步后删除此工作流。
# 新建原因：服务器部署密钥只能推送 Git，创建 PR 使用 Actions 的临时仓库令牌。
name: 飞书同步合并请求

on:
  push:
    branches: [codex/feishu-sync]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: feishu-sync-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 创建或复用同步 PR
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list --state open --base main --head codex/feishu-sync --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            printf '复用已有 PR：%s\n' "$existing"
            exit 0
          fi
          changed=$(gh api "repos/$GH_REPO/compare/main...codex%2Ffeishu-sync" --jq '.files | length')
          if [ "$changed" -eq 0 ]; then
            echo '同步分支没有待合并的文件变化。'
            exit 0
          fi
          gh pr create --base main --head codex/feishu-sync \
            --title '同步飞书新增策划附件与已绑定素材' \
            --body '服务器已将新增策划附件及已明确绑定的交付素材推送到同步分支，请审核 Files changed 后使用 merge commit 合并到 main，并保留 codex/feishu-sync 供后续同步。'
